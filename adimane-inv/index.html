<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stall Inventory Receipt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .meta-info {
            margin-bottom: 20px;
            font-size: 14px;
            color: #7f8c8d;
            display: flex;
            justify-content: space-between;
            background-color: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .sl-no {
            width: 15%;
            text-align: center;
        }
        th.sl-no {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>SaiRadhaEmpire - New Stall Dispatch</h2>
    
    <div class="meta-info">
        <div><strong>Date:</strong> 07-Nov-2026</div>
        <div><strong>Time:</strong> 9:28 AM</div>
    </div>
    
    <p style="margin-bottom: 15px; color: #34495e;"><strong>Issued To:</strong> Ravi</p>

    <table>
        <thead>
            <tr>
                <th class="sl-no">Sl. No.</th>
                <th>Item Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="sl-no">1</td>
                <td>Stall [May be table]</td>
            </tr>
            <tr>
                <td class="sl-no">2</td>
                <td>One standing Board</td>
            </tr>
            <tr>
                <td class="sl-no">3</td>
                <td>All cups (single use)</td>
            </tr>
            <tr>
                <td class="sl-no">4</td>
                <td>Steel Can (Big, 1 only)</td>
            </tr>
            <tr>
                <td class="sl-no">5</td>
                <td>1 Kg Tea Powder (500gms, 2 packet)</td>
            </tr>
            <tr>
                <td class="sl-no">6</td>
                <td>1 bundle Tissue Papers</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
